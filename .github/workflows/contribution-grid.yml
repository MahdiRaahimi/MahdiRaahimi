name: Generate Contribution Grid

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-grid.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Contribution Grid SVG
        run: |
          mkdir -p dist
          python3 << 'PYEOF'
          import urllib.request, json, datetime, sys

          USERNAME = "MahdiRaahimi"
          TOKEN = "${{ secrets.GITHUB_TOKEN }}"

          # Fetch contributions via GitHub REST API (events)
          url = f"https://api.github.com/users/{USERNAME}/events?per_page=100"
          req = urllib.request.Request(url, headers={
              "Authorization": f"token {TOKEN}",
              "Accept": "application/vnd.github.v3+json",
              "User-Agent": "contribution-grid-generator"
          })

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  events = json.loads(resp.read())
          except Exception as e:
              print(f"Warning: could not fetch events: {e}")
              events = []

          # Build contribution counts by day
          contrib_counts = {}
          for event in events:
              day = event.get("created_at", "")[:10]
              if day:
                  contrib_counts[day] = contrib_counts.get(day, 0) + 1

          # Generate grid for last 365 days (52 weeks x 7 days)
          today = datetime.date.today()
          # Find the Sunday of the current week
          days_since_sunday = today.weekday() + 1  # Sunday = 0
          start_date = today - datetime.timedelta(days=days_since_sunday + 364)

          weeks = []
          for w in range(53):
              week = []
              for d in range(7):
                  date = start_date + datetime.timedelta(days=w * 7 + d)
                  date_str = date.isoformat()
                  count = contrib_counts.get(date_str, 0)
                  week.append({"date": date_str, "count": count})
              weeks.append(week)

          # Color levels (GitHub dark theme)
          def color_for(count):
              if count == 0:
                  return "#161b22"
              elif count <= 2:
                  return "#0e4429"
              elif count <= 5:
                  return "#006d32"
              elif count <= 9:
                  return "#26a641"
              else:
                  return "#39d353"

          # SVG dimensions
          cell_size = 11
          cell_gap = 3
          margin_left = 30
          margin_top = 20
          label_height = 15
          svg_width = margin_left + len(weeks) * (cell_size + cell_gap) + 10
          svg_height = margin_top + 7 * (cell_size + cell_gap) + label_height + 10

          # Month labels
          month_names = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
          month_positions = {}
          for w_idx, week in enumerate(weeks):
              if week:
                  first_day = week[0]["date"]
                  month = int(first_day[5:7])
                  if month not in month_positions:
                      month_positions[month] = margin_left + w_idx * (cell_size + cell_gap)

          # Day labels (Mon, Wed, Fri)
          day_labels = {0: "", 1: "Mon", 2: "", 3: "Wed", 4: "", 5: "Fri", 6: ""}
          # Adjust: 0=Sunday in our layout
          day_labels_y = {1: 1, 3: 3, 5: 5}

          # Build SVG
          svg_parts = []
          svg_parts.append(f'<svg xmlns="http://www.w3.org/2000/svg" width="{svg_width}" height="{svg_height}" viewBox="0 0 {svg_width} {svg_height}">')

          # Background
          svg_parts.append(f'<rect width="{svg_width}" height="{svg_height}" fill="#0d1117" rx="6"/>')

          # Month labels
          svg_parts.append('<g font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b949e">')
          for month, x in sorted(month_positions.items()):
              svg_parts.append(f'<text x="{x}" y="{margin_top - 6}">{month_names[month-1]}</text>')
          svg_parts.append('</g>')

          # Day labels
          svg_parts.append('<g font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b949e">')
          for day_idx, label in day_labels.items():
              if label and day_idx in day_labels_y:
                  y = margin_top + day_labels_y[day_idx] * (cell_size + cell_gap) + cell_size - 1
                  svg_parts.append(f'<text x="0" y="{y}">{label}</text>')
          svg_parts.append('</g>')

          # Contribution cells
          svg_parts.append('<g>')
          for w_idx, week in enumerate(weeks):
              for d_idx, day in enumerate(week):
                  x = margin_left + w_idx * (cell_size + cell_gap)
                  y = margin_top + d_idx * (cell_size + cell_gap)
                  c = color_for(day["count"])
                  svg_parts.append(f'<rect x="{x}" y="{y}" width="{cell_size}" height="{cell_size}" rx="2" ry="2" fill="{c}"/>')
          svg_parts.append('</g>')

          # Legend
          legend_y = svg_height - 10
          legend_x = svg_width - 180
          legend_colors = ["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"]
          svg_parts.append('<g font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b949e">')
          svg_parts.append(f'<text x="{legend_x - 25}" y="{legend_y - 2}">Less</text>')
          for i, c in enumerate(legend_colors):
              lx = legend_x + i * (cell_size + cell_gap)
              svg_parts.append(f'<rect x="{lx}" y="{legend_y - 10}" width="{cell_size}" height="{cell_size}" rx="2" ry="2" fill="{c}"/>')
          svg_parts.append(f'<text x="{legend_x + 5 * (cell_size + cell_gap) + 4}" y="{legend_y - 2}">More</text>')
          svg_parts.append('</g>')

          svg_parts.append('</svg>')

          svg_content = '\n'.join(svg_parts)
          with open("dist/contribution-grid.svg", "w") as f:
              f.write(svg_content)
          print(f"Generated SVG: {len(svg_content)} bytes, {len(weeks)} weeks")
          PYEOF

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
