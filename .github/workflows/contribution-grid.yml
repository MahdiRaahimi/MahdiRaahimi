name: Generate Contribution Grid

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-grid.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Contribution Grid SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python3 << 'PYEOF'
          import urllib.request, json, datetime, sys

          USERNAME = "MahdiRaahimi"
          TOKEN = sys.environ.get("GH_TOKEN", "")

          # ── Fetch contributions via GraphQL API (gets full year, not just 90 events) ──
          query = '''
          {
            user(login: "%s") {
              contributionsCollection {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalRepositoryContributions
                totalPullRequestReviewContributions
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          ''' % USERNAME

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps({"query": query}).encode(),
              headers={
                  "Authorization": f"bearer {TOKEN}",
                  "Content-Type": "application/json",
                  "User-Agent": "contribution-grid-generator"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  result = json.loads(resp.read())
              cc = result["data"]["user"]["contributionsCollection"]
              calendar = cc["contributionCalendar"]
              total_contribs = calendar["totalContributions"]
              total_commits = cc["totalCommitContributions"]
              total_prs = cc["totalPullRequestContributions"]
              total_issues = cc["totalIssueContributions"]
              total_repos = cc["totalRepositoryContributions"]
              total_reviews = cc["totalPullRequestReviewContributions"]

              # Build contribution counts by date
              contrib_counts = {}
              for week in calendar["weeks"]:
                  for day in week["contributionDays"]:
                      contrib_counts[day["date"]] = day["contributionCount"]

              print(f"GraphQL: {total_contribs} total contributions, {total_commits} commits, {total_prs} PRs")
          except Exception as e:
              print(f"Warning: GraphQL API failed ({e}), falling back to REST events")
              # Fallback to REST API events
              url = f"https://api.github.com/users/{USERNAME}/events?per_page=100"
              req2 = urllib.request.Request(url, headers={
                  "Authorization": f"token {TOKEN}",
                  "Accept": "application/vnd.github.v3+json",
                  "User-Agent": "contribution-grid-generator"
              })
              try:
                  with urllib.request.urlopen(req2, timeout=30) as resp2:
                      events = json.loads(resp2.read())
                  contrib_counts = {}
                  for event in events:
                      day = event.get("created_at", "")[:10]
                      if day:
                          contrib_counts[day] = contrib_counts.get(day, 0) + 1
                  total_contribs = sum(contrib_counts.values())
                  total_commits = total_contribs
                  total_prs = total_issues = total_repos = total_reviews = 0
              except Exception as e2:
                  print(f"REST fallback also failed: {e2}")
                  contrib_counts = {}
                  total_contribs = total_commits = total_prs = total_issues = total_repos = total_reviews = 0

          # ── Generate grid ──
          today = datetime.date.today()
          # Find Sunday of current week
          days_since_sunday = today.weekday() + 1
          start_date = today - datetime.timedelta(days=days_since_sunday + 364)

          weeks = []
          for w in range(53):
              week = []
              for d in range(7):
                  date = start_date + datetime.timedelta(days=w * 7 + d)
                  date_str = date.isoformat()
                  count = contrib_counts.get(date_str, 0)
                  week.append({"date": date_str, "count": count})
              weeks.append(week)

          # Count active days and max
          active_days = 0
          max_count = 0
          for week in weeks:
              for day in week:
                  if day["count"] > 0:
                      active_days += 1
                      if day["count"] > max_count:
                          max_count = day["count"]

          # Color levels (GitHub dark theme)
          def color_for(count):
              if count == 0:
                  return "#161b22"
              elif count <= 2:
                  return "#0e4429"
              elif count <= 5:
                  return "#006d32"
              elif count <= 9:
                  return "#26a641"
              else:
                  return "#39d353"

          # SVG dimensions
          cell_size = 11
          cell_gap = 3
          margin_left = 30
          margin_top = 45  # More space for title
          label_height = 15
          svg_width = margin_left + len(weeks) * (cell_size + cell_gap) + 10
          svg_height = margin_top + 7 * (cell_size + cell_gap) + label_height + 25  # Extra for footer

          # Month labels
          month_names = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
          month_positions = {}
          for w_idx, week in enumerate(weeks):
              if week:
                  first_day = week[0]["date"]
                  month = int(first_day[5:7])
                  if month not in month_positions:
                      month_positions[month] = margin_left + w_idx * (cell_size + cell_gap)

          # ── Build SVG ──
          svg_parts = []
          svg_parts.append(f'<svg xmlns="http://www.w3.org/2000/svg" width="{svg_width}" height="{svg_height}" viewBox="0 0 {svg_width} {svg_height}">')

          # Background
          svg_parts.append(f'<rect width="{svg_width}" height="{svg_height}" fill="#0d1117" rx="8"/>')

          # ── Title: username and total contributions ──
          svg_parts.append('<g font-family="Segoe UI, Arial, sans-serif">')
          svg_parts.append(f'<text x="15" y="22" font-size="13" font-weight="600" fill="#c9d1d9">{total_contribs} contributions in the last year</text>')
          svg_parts.append('</g>')

          # ── Stats row: commits, PRs, repos ──
          stats_y = 35
          stats_items = [
              (total_commits, "commits", "#39d353"),
              (total_prs, "pull requests", "#00F5D4"),
              (total_repos, "repositories", "#58a6ff"),
              (total_issues, "issues", "#f78166"),
              (total_reviews, "reviews", "#bc8cff"),
          ]
          stats_x = 15
          svg_parts.append('<g font-family="Segoe UI, Arial, sans-serif" font-size="11">')
          for count, label, color in stats_items:
              if count > 0:
                  svg_parts.append(f'<text x="{stats_x}" y="{stats_y}" fill="{color}">{count}</text>')
                  svg_parts.append(f'<text x="{stats_x + 14}" y="{stats_y}" fill="#8b949e">{label}</text>')
                  stats_x += 14 + len(label) * 5.5 + 15
          svg_parts.append('</g>')

          # ── Month labels ──
          svg_parts.append('<g font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b949e">')
          for month, x in sorted(month_positions.items()):
              svg_parts.append(f'<text x="{x}" y="{margin_top - 6}">{month_names[month-1]}</text>')
          svg_parts.append('</g>')

          # ── Day labels (Mon, Wed, Fri) ──
          day_labels = {1: "Mon", 3: "Wed", 5: "Fri"}
          svg_parts.append('<g font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b949e">')
          for day_idx, label in day_labels.items():
              y = margin_top + day_idx * (cell_size + cell_gap) + cell_size - 1
              svg_parts.append(f'<text x="2" y="{y}">{label}</text>')
          svg_parts.append('</g>')

          # ── Contribution cells ──
          svg_parts.append('<g>')
          for w_idx, week in enumerate(weeks):
              for d_idx, day in enumerate(week):
                  x = margin_left + w_idx * (cell_size + cell_gap)
                  y = margin_top + d_idx * (cell_size + cell_gap)
                  c = color_for(day["count"])
                  svg_parts.append(f'<rect x="{x}" y="{y}" width="{cell_size}" height="{cell_size}" rx="2" ry="2" fill="{c}"/>')
          svg_parts.append('</g>')

          # ── Footer: active days, max day, legend ──
          footer_y = svg_height - 12
          footer_y_top = svg_height - 20

          # Active days badge
          svg_parts.append('<g font-family="Segoe UI, Arial, sans-serif" font-size="11">')
          svg_parts.append(f'<text x="15" y="{footer_y}" fill="#39d353">Active: {active_days} days</text>')
          svg_parts.append(f'<text x="120" y="{footer_y}" fill="#39d353">Max: {max_count} in a day</text>')
          svg_parts.append('</g>')

          # Legend (right side)
          legend_colors = ["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"]
          legend_x = svg_width - 190
          svg_parts.append('<g font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b949e">')
          svg_parts.append(f'<text x="{legend_x - 25}" y="{footer_y}">Less</text>')
          for i, c in enumerate(legend_colors):
              lx = legend_x + i * (cell_size + cell_gap)
              svg_parts.append(f'<rect x="{lx}" y="{footer_y - 9}" width="{cell_size}" height="{cell_size}" rx="2" ry="2" fill="{c}"/>')
          svg_parts.append(f'<text x="{legend_x + 5 * (cell_size + cell_gap) + 4}" y="{footer_y}">More</text>')
          svg_parts.append('</g>')

          svg_parts.append('</svg>')

          svg_content = '\n'.join(svg_parts)
          with open("dist/contribution-grid.svg", "w") as f:
              f.write(svg_content)
          print(f"Generated SVG: {len(svg_content)} bytes, {len(weeks)} weeks, {total_contribs} total contributions")
          PYEOF

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
