<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#7209B7" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a2e" stroke-width="0.5" />
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1a1a2e" />
    </pattern>
    <linearGradient id="strokeAnim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#00F5D4;#7209B7;#F72585;#00F5D4" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%">
        <animate attributeName="stop-color" values="#7209B7;#F72585;#00F5D4;#7209B7" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#F72585;#00F5D4;#7209B7;#F72585" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="350" fill="url(#bgGrad)" />
  <rect width="1200" height="350" fill="url(#grid)" />

  <!-- Circle 1 -->
  <circle cx="150" cy="80" r="40" stroke="#00F5D4" stroke-width="2" fill="none" opacity="0.3">
    <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" from="0 150 80" to="360 150 80" dur="20s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="80" r="10" fill="#00F5D4" filter="url(#glow)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Circle 2 -->
  <circle cx="1050" cy="270" r="35" stroke="#7209B7" stroke-width="2" fill="none" opacity="0.3">
    <animate attributeName="cy" values="270;250;270" dur="5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" from="360 1050 270" to="0 1050 270" dur="15s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="270" r="8" fill="#7209B7" filter="url(#glow)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Hexagon -->
  <polygon points="80,260 100,235 130,235 150,260 130,285 100,285" stroke="#F72585" stroke-width="2" fill="none" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 115 260" to="360 115 260" dur="25s" repeatCount="indefinite" />
  </polygon>

  <!-- Triangle -->
  <polygon points="1120,60 1150,110 1090,110" stroke="#00F5D4" stroke-width="2" fill="none" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 1120 85" to="-360 1120 85" dur="18s" repeatCount="indefinite" />
  </polygon>

  <!-- Small floating squares -->
  <rect x="60" y="140" width="15" height="15" stroke="#00B4D8" stroke-width="1.5" fill="none" opacity="0.4">
    <animate attributeName="x" values="60;65;60" dur="3s" repeatCount="indefinite" />
    <animate attributeName="y" values="140;135;140" dur="3.5s" repeatCount="indefinite" />
  </rect>
  <rect x="1100" y="170" width="20" height="20" stroke="#F72585" stroke-width="1.5" fill="none" opacity="0.4">
    <animate attributeName="x" values="1100;1105;1100" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y" values="170;165;170" dur="3.5s" repeatCount="indefinite" />
  </rect>

  <!-- Animated top border line -->
  <line x1="350" y1="45" x2="850" y2="45" stroke="url(#strokeAnim)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="x1" values="350;340;350" dur="3s" repeatCount="indefinite" />
    <animate attributeName="x2" values="850;860;850" dur="3s" repeatCount="indefinite" />
  </line>

  <!-- Name -->
  <text x="600" y="125" font-family="Fira Code, monospace" font-size="52" font-weight="bold" text-anchor="middle" fill="url(#textGrad)" filter="url(#glow)">
    MAHDI RAHIMI
    <animate attributeName="opacity" values="1;0.85;1" dur="4s" repeatCount="indefinite" />
  </text>

  <!-- Subtitle -->
  <rect x="340" y="145" width="520" height="30" rx="4" fill="#1a1a2e" opacity="0.8" />
  <text x="600" y="166" font-family="Fira Code, monospace" font-size="18" font-weight="500" text-anchor="middle" fill="#00F5D4">
    <tspan>Full-Stack Developer</tspan>
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" />
  </text>

  <!-- Cursor blink -->
  <rect x="848" y="152" width="2" height="16" fill="#00F5D4">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
  </rect>

  <!-- Tech badges row -->
  <g font-family="monospace" font-size="13" font-weight="bold">
    <rect x="270" y="200" width="80" height="28" rx="6" fill="#1a1a2e" stroke="#239120" stroke-width="1.5" />
    <text x="310" y="218" text-anchor="middle" fill="#239120" opacity="0.9">
      C# ▸ .NET
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite" />
    </text>
    <rect x="360" y="200" width="90" height="28" rx="6" fill="#1a1a2e" stroke="#512BD4" stroke-width="1.5" />
    <text x="405" y="218" text-anchor="middle" fill="#512BD4" opacity="0.9">
      ASP.NET
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.5s" repeatCount="indefinite" />
    </text>
    <rect x="460" y="200" width="80" height="28" rx="6" fill="#1a1a2e" stroke="#44B78B" stroke-width="1.5" />
    <text x="500" y="218" text-anchor="middle" fill="#44B78B" opacity="0.9">
      Django
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.2s" repeatCount="indefinite" />
    </text>
    <rect x="550" y="200" width="70" height="28" rx="6" fill="#1a1a2e" stroke="#61DAFB" stroke-width="1.5" />
    <text x="585" y="218" text-anchor="middle" fill="#61DAFB" opacity="0.9">
      React
      <animate attributeName="opacity" values="0.9;1;0.9" dur="1.8s" repeatCount="indefinite" />
    </text>
    <rect x="630" y="200" width="110" height="28" rx="6" fill="#1a1a2e" stroke="#FF6600" stroke-width="1.5" />
    <text x="685" y="218" text-anchor="middle" fill="#FF6600" opacity="0.9">
      RabbitMQ
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.7s" repeatCount="indefinite" />
    </text>
    <rect x="750" y="200" width="110" height="28" rx="6" fill="#1a1a2e" stroke="#CC2927" stroke-width="1.5" />
    <text x="805" y="218" text-anchor="middle" fill="#CC2927" opacity="0.9">
      SQL Server
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.3s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Tag line -->
  <text x="600" y="262" font-family="Fira Code, monospace" font-size="14" font-weight="400" text-anchor="middle" fill="#8b949e" opacity="0.8">
    ⚡ 4+ years building enterprise systems · ERP · Industry portals · University platforms · Corporate websites
  </text>

  <!-- Location -->
  <text x="600" y="295" font-family="monospace" font-size="13" font-weight="400" text-anchor="middle" fill="#c9d1d9" opacity="0.7">
    📍 Iran · Tehran-Karaj  |  🎓 Azad University, Karaj  |  💡 Innovation &amp; Challenges
  </text>

  <!-- Status dot -->
  <circle cx="430" cy="320" r="4" fill="#00F5D4">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="445" y="324" font-family="monospace" font-size="12" fill="#00F5D4" opacity="0.8">
    Available for remote work &amp; freelance
  </text>
</svg>
